services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: doefacil
      POSTGRES_USER: doefacil
      POSTGRES_PASSWORD: doefacil_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - doefacil_pg:/var/lib/postgresql/data
      - ./database/modelo-logico.sql:/docker-entrypoint-initdb.d/01-modelo.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doefacil -d doefacil"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  doefacil_pg:
